name: provision

# Manually run once before the demo to create the Cloudsmith OIDC config.
# Uses ephemeral Terraform state (nothing persisted between runs).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve -input=false

      - name: Show outputs (service slugs to use in demo.yml)
        run: terraform -chdir=terraform output
